<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <rect x="0" y="0" width="1000" height="700" fill="#0b1f2e"/>
  <!-- roads -->
  <rect x="0" y="330" width="1000" height="40" fill="#33475b"/>
  <rect x="480" y="0" width="40" height="700" fill="#33475b"/>

  <!-- top-left plots -->
  <g stroke="#3d5a6c" stroke-width="2" fill="none">
    <rect x="40" y="40" width="420" height="90"/>
    <rect x="40" y="140" width="420" height="90"/>
    <rect x="40" y="240" width="420" height="70"/>
  </g>
  <text x="60" y="90" font-size="16" fill="#9fb4c2" font-family="Arial">A1</text>
  <text x="60" y="190" font-size="16" fill="#9fb4c2" font-family="Arial">A2</text>
  <text x="60" y="280" font-size="16" fill="#9fb4c2" font-family="Arial">A3</text>

  <!-- top-right plots -->
  <g stroke="#3d5a6c" stroke-width="2" fill="none">
    <rect x="540" y="40" width="420" height="90"/>
    <rect x="540" y="140" width="420" height="90"/>
    <rect x="540" y="240" width="420" height="70"/>
  </g>
  <text x="560" y="90" font-size="16" fill="#9fb4c2" font-family="Arial">B1</text>
  <text x="560" y="190" font-size="16" fill="#9fb4c2" font-family="Arial">B2</text>
  <text x="560" y="280" font-size="16" fill="#9fb4c2" font-family="Arial">B3</text>

  <!-- bottom-right plots -->
  <g stroke="#3d5a6c" stroke-width="2" fill="none">
    <rect x="540" y="390" width="420" height="90"/>
    <rect x="540" y="490" width="420" height="90"/>
    <rect x="540" y="590" width="420" height="70"/>
  </g>
  <text x="560" y="440" font-size="16" fill="#9fb4c2" font-family="Arial">C1</text>
  <text x="560" y="540" font-size="16" fill="#9fb4c2" font-family="Arial">C2</text>
  <text x="560" y="630" font-size="16" fill="#9fb4c2" font-family="Arial">C3</text>

  <!-- bottom-left: building footprint (label is rendered dynamically by the app, not baked in here) -->
  <rect x="40" y="390" width="420" height="270" fill="#26314a" stroke="#4b5a7a" stroke-width="2"/>

  <!-- trees -->
  <g fill="#3f6b4a">
    <circle cx="15" cy="15" r="8"/><circle cx="15" cy="685" r="8"/>
    <circle cx="985" cy="15" r="8"/><circle cx="985" cy="685" r="8"/>
    <circle cx="500" cy="685" r="8"/>
  </g>
</svg>
